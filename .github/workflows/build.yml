name: Build OpenSSL

on:
  schedule:
    - cron: '0 1 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 说明：所有 Linux 任务均显式指定 runner 镜像版本，不再使用 ubuntu-latest。
#   ubuntu-latest 自 2026-10-19 起陆续从 24.04 迁移到 26.04，同一份 workflow
#   在不同时间会落到不同镜像上，导致产物（编译器 / glibc 版本）漂移。
#   此处固定为 ubuntu-24.04 / ubuntu-24.04-arm，并额外提供 ubuntu-22.04 /
#   ubuntu-22.04-arm 构建以覆盖更低 glibc 基线的使用场景。

jobs:
  detect-versions:
    name: Detect OpenSSL versions
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Detect stable releases
        id: versions
        run: |
          VERSIONS=$(python3 -c "
          import subprocess, re, json

          r = subprocess.run(['git', 'ls-remote', '--tags',
              'https://github.com/openssl/openssl.git'],
              capture_output=True, text=True)

          # All version-like tags within 3.x / 4.x (including pre-releases)
          all_tags = re.findall(r'refs/tags/(openssl-(?:3|4)\.\d+\.\d+(?:-[a-z]+\d+)?)$', r.stdout, re.M)

          def sort_key(v):
              v = v.replace('openssl-', '')
              parts = v.split('-')
              ver = tuple(int(x) for x in parts[0].split('.'))
              if len(parts) > 1:
                  return ver + (parts[1],)
              return ver + ('~~',)

          all_sorted = sorted(set(all_tags), key=sort_key, reverse=True)
          latest_overall = all_sorted[0]

          # Stable only (no suffix)
          stable = [t for t in all_tags if re.match(r'^openssl-\d+\.\d+\.\d+$', t)]
          stable_sorted = sorted(set(stable),
              key=lambda v: tuple(int(x) for x in v.replace('openssl-','').split('.')),
              reverse=True)
          latest_stable = stable_sorted[0]

          specific = ['openssl-3.0.22', 'openssl-3.6.4']
          all_versions = specific + [latest_stable, latest_overall]
          seen = set()
          unique = []
          for v in all_versions:
              if v not in seen:
                  unique.append(v)
                  seen.add(v)

          print(json.dumps(unique))
          ")
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "Detected versions: $VERSIONS"

  build:
    name: ${{ matrix.config.name }} / ${{ matrix.version }}
    needs: detect-versions
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.detect-versions.outputs.versions) }}
        config:
          # ---------- Windows ----------
          - name: windows-msvc
            os: windows-2025
            compiler: msvc
            target: VC-WIN64A
            arch: amd64

          - name: windows-llvm-mingw
            os: ubuntu-24.04
            compiler: llvm-mingw
            target: mingw64
            cross_prefix: x86_64-w64-mingw32-

          # ---------- Ubuntu 24.04 (glibc 2.39) ----------
          - name: ubuntu-24.04-gcc-x86_64
            os: ubuntu-24.04
            compiler: gcc
            target: linux-x86_64
            arch: x86_64

          - name: ubuntu-24.04-gcc-aarch64
            os: ubuntu-24.04-arm
            compiler: gcc
            target: linux-aarch64
            arch: aarch64

          - name: ubuntu-24.04-clang-x86_64
            os: ubuntu-24.04
            compiler: clang
            target: linux-x86_64-clang
            arch: x86_64

          - name: ubuntu-24.04-clang-aarch64
            os: ubuntu-24.04-arm
            compiler: clang
            target: linux-aarch64
            arch: aarch64

          # ---------- Ubuntu 22.04 (glibc 2.35，向下兼容旧系统) ----------
          - name: ubuntu-22.04-gcc-x86_64
            os: ubuntu-22.04
            compiler: gcc
            target: linux-x86_64
            arch: x86_64

          - name: ubuntu-22.04-gcc-aarch64
            os: ubuntu-22.04-arm
            compiler: gcc
            target: linux-aarch64
            arch: aarch64

    env:
      OPENSSL_FLAGS_COMMON: zlib enable-rc5 enable-md2 enable-weak-ssl-ciphers no-makedepend

    steps:
      - name: Checkout OpenSSL
        uses: actions/checkout@v4
        with:
          repository: openssl/openssl
          ref: ${{ matrix.version }}
          path: openssl

      # ==================== MSVC SETUP ====================
      - name: Setup MSVC
        if: matrix.config.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - name: Install NASM + Strawberry Perl (MSVC)
        if: matrix.config.compiler == 'msvc'
        shell: pwsh
        run: |
          choco install nasm strawberryperl --no-progress -y

      - name: Build zlib (MSVC)
        if: matrix.config.compiler == 'msvc'
        id: zlib-msvc
        working-directory: openssl
        shell: pwsh
        run: |
          git clone https://github.com/madler/zlib.git --depth 1 ../zlib
          Set-Location ../zlib
          nmake -f win32/Makefile.msc
          $d = (Get-Location).Path
          echo "zlib_include=$d" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "zlib_lib=$d\zlib.lib" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ==================== LLVM-MINGW SETUP ====================
      - name: Setup LLVM-MinGW
        if: matrix.config.compiler == 'llvm-mingw'
        run: |
          V='20260922'
          F="llvm-mingw-${V}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSLO "https://github.com/mstorsjo/llvm-mingw/releases/download/${V}/${F}"
          tar -xf "$F"
          echo "$(pwd)/llvm-mingw-${V}-ucrt-ubuntu-22.04-x86_64/bin" >> $GITHUB_PATH

      - name: Build zlib (LLVM-MinGW)
        if: matrix.config.compiler == 'llvm-mingw'
        id: zlib-mingw
        working-directory: openssl
        run: |
          git clone https://github.com/madler/zlib.git --depth 1 ../zlib-mingw
          cd ../zlib-mingw
          PFX=${{ matrix.config.cross_prefix }}
          CHOST=${PFX%-} CC=${PFX}gcc AR=${PFX}ar RANLIB=${PFX}ranlib ./configure --static --prefix=$PWD/../zlib-install
          make -j$(nproc) && make install
          echo "zlib_include=$PWD/../zlib-install/include" >> $GITHUB_OUTPUT
          echo "zlib_lib=$PWD/../zlib-install/lib" >> $GITHUB_OUTPUT

      # ==================== LINUX SETUP ====================
      - name: Install zlib + perl (Linux)
        if: matrix.config.compiler == 'gcc' || matrix.config.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev perl

      - name: Install Clang (Linux)
        if: matrix.config.compiler == 'clang'
        run: |
          sudo apt-get install -y clang

      # ==================== VERIFY TOOLS ====================
      - name: Verify tools (MSVC)
        if: matrix.config.compiler == 'msvc'
        shell: pwsh
        run: |
          perl --version
          nasm --version

      - name: Verify tools (LLVM-MinGW)
        if: matrix.config.compiler == 'llvm-mingw'
        run: |
          ${{ matrix.config.cross_prefix }}gcc --version

      - name: Verify tools (GCC)
        if: matrix.config.compiler == 'gcc'
        run: |
          gcc --version
          . /etc/os-release && echo "Runner OS: $PRETTY_NAME"
          ldd --version | head -1

      - name: Verify tools (Clang)
        if: matrix.config.compiler == 'clang'
        run: |
          clang --version
          . /etc/os-release && echo "Runner OS: $PRETTY_NAME"
          ldd --version | head -1

      # ==================== CONFIGURE ====================
      - name: Configure (MSVC)
        if: matrix.config.compiler == 'msvc'
        working-directory: openssl
        shell: pwsh
        run: |
          perl Configure ${{ matrix.config.target }} ${{ env.OPENSSL_FLAGS_COMMON }} `
            --with-zlib-include="${{ steps.zlib-msvc.outputs.zlib_include }}" `
            --with-zlib-lib="${{ steps.zlib-msvc.outputs.zlib_lib }}" `
            --prefix="$env:GITHUB_WORKSPACE\openssl\install"

      - name: Configure (LLVM-MinGW)
        if: matrix.config.compiler == 'llvm-mingw'
        working-directory: openssl
        run: |
          perl Configure ${{ matrix.config.target }} \
            --cross-compile-prefix=${{ matrix.config.cross_prefix }} \
            ${{ env.OPENSSL_FLAGS_COMMON }} \
            --with-zlib-include=${{ steps.zlib-mingw.outputs.zlib_include }} \
            --with-zlib-lib=${{ steps.zlib-mingw.outputs.zlib_lib }} \
            --prefix=$GITHUB_WORKSPACE/openssl/install

      - name: Configure (GCC x86_64 / Clang x86_64)
        if: (matrix.config.compiler == 'gcc' || matrix.config.compiler == 'clang') && matrix.config.target != 'linux-aarch64'
        working-directory: openssl
        run: |
          perl Configure ${{ matrix.config.target }} \
            ${{ env.OPENSSL_FLAGS_COMMON }} \
            --prefix=$GITHUB_WORKSPACE/openssl/install

      - name: Configure (GCC/Clang aarch64)
        if: (matrix.config.compiler == 'gcc' || matrix.config.compiler == 'clang') && matrix.config.target == 'linux-aarch64'
        working-directory: openssl
        run: |
          export CC=${{ matrix.config.compiler }}
          export CXX=${{ matrix.config.compiler == 'gcc' && 'g++' || 'clang++' }}
          perl Configure linux-aarch64 \
            ${{ env.OPENSSL_FLAGS_COMMON }} \
            --prefix=$GITHUB_WORKSPACE/openssl/install

      # ==================== BUILD ====================
      - name: Build (MSVC)
        if: matrix.config.compiler == 'msvc'
        working-directory: openssl
        timeout-minutes: 60
        shell: pwsh
        run: nmake

      - name: Build (Unix)
        if: matrix.config.compiler != 'msvc'
        working-directory: openssl
        timeout-minutes: 60
        run: make -j$(nproc)

      # ==================== TEST ====================
      - name: Test (MSVC)
        if: matrix.config.compiler == 'msvc'
        working-directory: openssl
        timeout-minutes: 120
        shell: pwsh
        run: nmake test

      - name: Test (GCC/Clang)
        if: matrix.config.compiler == 'gcc' || matrix.config.compiler == 'clang'
        working-directory: openssl
        timeout-minutes: 120
        run: make -j$(nproc) test

      # Skip LLVM-MinGW tests (cross-compiled binary)

      # ==================== INSTALL ====================
      - name: Install (MSVC)
        if: matrix.config.compiler == 'msvc'
        working-directory: openssl
        shell: pwsh
        run: nmake install

      - name: Install (Unix)
        if: matrix.config.compiler != 'msvc'
        working-directory: openssl
        run: make install

      # ==================== VERIFY ====================
      - name: Verify (GCC/Clang)
        if: matrix.config.compiler == 'gcc' || matrix.config.compiler == 'clang'
        working-directory: openssl
        run: |
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/openssl/install/lib:$GITHUB_WORKSPACE/openssl/install/lib64
          $GITHUB_WORKSPACE/openssl/install/bin/openssl version
          $GITHUB_WORKSPACE/openssl/install/bin/openssl list -providers
          $GITHUB_WORKSPACE/openssl/install/bin/openssl ciphers -v ALL:COMPLEMENTOFALL | head -20

      - name: Verify (LLVM-MinGW)
        if: matrix.config.compiler == 'llvm-mingw'
        working-directory: openssl
        run: |
          file $GITHUB_WORKSPACE/openssl/install/bin/openssl.exe

      - name: Verify (MSVC)
        if: matrix.config.compiler == 'msvc'
        shell: pwsh
        working-directory: openssl
        run: |
          & $env:GITHUB_WORKSPACE\openssl\install\bin\openssl.exe version
          & $env:GITHUB_WORKSPACE\openssl\install\bin\openssl.exe list -providers
          & $env:GITHUB_WORKSPACE\openssl\install\bin\openssl.exe ciphers -v ALL:COMPLEMENTOFALL | Select-Object -First 20

      # ==================== BUILD INFO ====================
      # 记录构建环境，方便使用者判断产物所需的 glibc / 编译器版本
      - name: Write BUILD_INFO (Unix)
        if: matrix.config.compiler != 'msvc'
        working-directory: openssl
        run: |
          COMPILER_BIN=${{ matrix.config.compiler }}
          if [ "$COMPILER_BIN" = "llvm-mingw" ]; then
            COMPILER_BIN="${{ matrix.config.cross_prefix }}gcc"
          fi
          {
            echo "openssl_version: ${{ matrix.version }}"
            echo "build_config:    ${{ matrix.config.name }}"
            echo "runner:          ${{ matrix.config.os }}"
            echo "target:          ${{ matrix.config.target }}"
            echo "compiler:        $("$COMPILER_BIN" --version 2>/dev/null | head -1)"
            if [ -f /etc/os-release ]; then . /etc/os-release; echo "runner_os:       $PRETTY_NAME"; fi
            echo "glibc:           $(ldd --version 2>/dev/null | head -1)"
            echo "built_at:        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit:          ${{ github.sha }}"
          } > $GITHUB_WORKSPACE/openssl/install/BUILD_INFO.txt
          cat $GITHUB_WORKSPACE/openssl/install/BUILD_INFO.txt

      - name: Write BUILD_INFO (MSVC)
        if: matrix.config.compiler == 'msvc'
        shell: pwsh
        working-directory: openssl
        run: |
          $info = @(
            "openssl_version: ${{ matrix.version }}"
            "build_config:    ${{ matrix.config.name }}"
            "runner:          ${{ matrix.config.os }}"
            "target:          ${{ matrix.config.target }}"
            "built_at:        $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "commit:          ${{ github.sha }}"
          )
          $info | Out-File -FilePath "$env:GITHUB_WORKSPACE\openssl\install\BUILD_INFO.txt" -Encoding utf8

      # ==================== UPLOAD ARTIFACTS ====================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openssl-${{ matrix.version }}-${{ matrix.config.name }}
          path: ${{ github.workspace }}/openssl/install

  release:
    name: Release ${{ matrix.version }}
    needs: [detect-versions, build]
    if: success()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.detect-versions.outputs.versions) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openssl-${{ matrix.version }}-*
          path: artifacts

      - name: Create tar.gz archives
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            echo "Archiving $name..."
            tar -czf "${name}.tar.gz" "$name"
          done
          ls -la *.tar.gz

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build/${{ matrix.version }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release '$TAG' already exists, skipping"
            exit 0
          fi
          PRE_FLAG=""
          if echo "${{ matrix.version }}" | grep -qiE '-(alpha|beta|dev|rc)'; then
            PRE_FLAG="--prerelease"
          fi
          gh release create "$TAG" artifacts/*.tar.gz \
            --title "OpenSSL ${{ matrix.version }}" \
            --notes "Prebuilt OpenSSL ${{ matrix.version }} binaries.

          Built with: zlib compression, rc5, md2, weak-ssl-ciphers

          Platforms:
          - windows-msvc (x64, Windows Server 2025)
          - windows-llvm-mingw (x64 cross-compile)
          - ubuntu-24.04-gcc-x86_64        (glibc >= 2.39)
          - ubuntu-24.04-gcc-aarch64       (glibc >= 2.39)
          - ubuntu-24.04-clang-x86_64      (glibc >= 2.39)
          - ubuntu-24.04-clang-aarch64     (glibc >= 2.39)
          - ubuntu-22.04-gcc-x86_64        (glibc >= 2.35)
          - ubuntu-22.04-gcc-aarch64       (glibc >= 2.35)

          Each archive contains a BUILD_INFO.txt with the exact toolchain used." \
            $PRE_FLAG
